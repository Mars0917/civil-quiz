<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>土木施工學題庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mute:#6b6f76;--line:#e3dfd6;--acc:#2f5d8a;--ok:#2e7d4f;--okbg:#e5f4e9;--bad:#b3392f;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181b;--card:#202327;--ink:#e8e6e1;--mute:#9aa0a6;--line:#33373c;--acc:#7aa7d6;--ok:#6cc08c;--okbg:#1f3328;--bad:#ec7b70;--badbg:#3a2220}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181b;--card:#202327;--ink:#e8e6e1;--mute:#9aa0a6;--line:#33373c;--acc:#7aa7d6;--ok:#6cc08c;--okbg:#1f3328;--bad:#ec7b70;--badbg:#3a2220}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.warn{color:var(--bad);font-size:.9rem;margin:8px 0 0}
button:focus-visible,.choice:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
label.opt:last-child{border-bottom:0}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer}
button.ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:1rem;cursor:pointer;margin-top:10px}
button:disabled{opacity:.45;cursor:default}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem}
.qid{font-size:.8rem;color:var(--mute)}
.stem{font-size:1.08rem;font-weight:600;margin:6px 0 14px}
.choice{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1rem;cursor:pointer}
.choice b{display:inline-block;width:1.6em;color:var(--mute)}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.big{font-size:2.6rem;font-weight:700;text-align:center;margin:6px 0}
.center{text-align:center;color:var(--mute)}
.rev{border-left:3px solid var(--bad);padding:6px 0 6px 12px;margin:12px 0}
.rev .a{color:var(--ok);font-size:.93rem}
.rev .y{color:var(--bad);font-size:.93rem}
.hidden{display:none}
</style>
<div class="wrap">
  <h1>土木施工學 測驗</h1>
  <p class="sub">第三章 鋼筋工程・第四章 混凝土工程｜共 <span id="total"></span> 題</p>

  <section id="setup">
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">出題範圍</div>
      <div id="secs"></div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px">題數</div>
      <div class="row" id="counts"></div>
    </div>
    <button class="main" id="start">開始測驗</button>
    <p class="warn" id="warn" hidden>請至少勾選一個出題範圍</p>
    <button class="ghost" id="wrongBtn">只練錯題本（<span id="wrongN">0</span> 題）</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="meta"><span id="pos"></span><span id="score"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="qid" id="qid"></div>
      <div class="stem" id="stem"></div>
      <div id="choices"></div>
      <div id="fb"></div>
    </div>
    <button class="main" id="next" disabled>下一題</button>
    <button class="ghost" id="quit">結束並看成績</button>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <div class="center">本次得分</div>
      <div class="big" id="pct"></div>
      <div class="center" id="detail"></div>
    </div>
    <div class="card" id="reviewBox"><div style="font-weight:600">錯題檢討</div><div id="review"></div></div>
    <button class="main" id="retryWrong">重做這次錯的題目</button>
    <button class="ghost" id="home">回首頁</button>
  </section>
</div>

<script>
const RAW = [{"id": "3-1", "sec": "第三章 鋼筋工程", "s": "鋼筋混凝土中，鋼筋主要用來抵抗何種力量？", "o": ["抗壓", "抗拉及彎矩", "抗磨", "抗凍融"], "a": 1, "p": "p.59"}, {"id": "3-2", "sec": "第三章 鋼筋工程", "s": "鋼筋之降伏點約在多少範圍？", "o": ["1400～2800 kg/cm²", "2800～5600 kg/cm²", "5600～8400 kg/cm²", "210～420 kg/cm²"], "a": 1, "p": "p.59"}, {"id": "3-3", "sec": "第三章 鋼筋工程", "s": "鋼筋降伏點愈高，下列敘述何者正確？", "o": ["抗拉力愈強但韌性差", "抗拉力愈弱但韌性佳", "延展性愈佳", "握裹力愈差"], "a": 0, "p": "p.59"}, {"id": "3-4", "sec": "第三章 鋼筋工程", "s": "依結構混凝土施工規範5.2.1，除螺箍筋可為光面外，鋼筋品質須符合哪一國家標準？", "o": ["CNS 1176", "CNS 1230", "CNS 560", "CNS 5646"], "a": 2, "p": "p.59"}, {"id": "3-5", "sec": "第三章 鋼筋工程", "s": "普通鋼筋係以含碳量多少之中碳鋼製造？", "o": ["0.05%～0.15%", "0.35%～0.55%", "0.75%～1.0%", "1.5%～2.0%"], "a": 1, "p": "p.59"}, {"id": "3-6", "sec": "第三章 鋼筋工程", "s": "水淬鋼筋表層硬、心部軟，故不宜採用下列哪種續接？", "o": ["搭接", "鐵線綁紮", "銲接及車牙機械式續接", "壓合式續接器"], "a": 2, "p": "p.60"}, {"id": "3-7", "sec": "第三章 鋼筋工程", "s": "可銲鋼筋代號 SD420W 中的「W」代表？", "o": ["Weight", "Wire", "Welding（焊接）", "Wide"], "a": 2, "p": "p.60"}, {"id": "3-8", "sec": "第三章 鋼筋工程", "s": "由鋼鐵廢料再軋製成、缺乏延展性而不適用耐震結構之鋼筋為？", "o": ["熱軋鋼筋", "再軋鋼筋", "加釩鋼筋", "鍍鋅鋼筋"], "a": 1, "p": "p.60"}, {"id": "3-9", "sec": "第三章 鋼筋工程", "s": "常用於海邊、河流等易腐蝕構造物（如淡江大橋橋墩）之鋼筋為？", "o": ["水淬鋼筋", "再軋鋼筋", "鍍鋅鋼筋", "可銲鋼筋"], "a": 2, "p": "p.60"}, {"id": "3-10", "sec": "第三章 鋼筋工程", "s": "高拉鋼筋 SD420 抗拉強度 4200 kg/cm²，常用於幾號以上之鋼筋？", "o": ["#3", "#4", "#5", "#6"], "a": 3, "p": "p.61"}, {"id": "3-11", "sec": "第三章 鋼筋工程", "s": "光面鋼筋不適用於鋼筋混凝土，主因為？", "o": ["強度太高", "表面光滑握裹力差", "重量太重", "不易彎曲"], "a": 1, "p": "p.61"}, {"id": "3-12", "sec": "第三章 鋼筋工程", "s": "竹節鋼筋斷面積須以重量法計算，公式為？", "o": ["A = W·ρ·L", "A = W/(ρL)", "A = ρL/W", "A = πd²/2"], "a": 1, "p": "p.62"}, {"id": "3-13", "sec": "第三章 鋼筋工程", "s": "副筋之配置方向與主筋的關係為？", "o": ["平行", "垂直", "45° 斜交", "無規定"], "a": 1, "p": "p.63"}, {"id": "3-14", "sec": "第三章 鋼筋工程", "s": "植筋時，fy = 4200 kg/cm² 鋼筋之孔深應為？", "o": ["6d", "10d", "12d", "16d"], "a": 3, "p": "p.63"}, {"id": "3-15", "sec": "第三章 鋼筋工程", "s": "箍筋依其形狀可分為？", "o": ["方形及螺旋形", "圓形及三角形", "單肢及雙肢", "直線及 料（一般粒料）之比重約為？", "o": ["1.5～1.8", "2.0～2.3", "2.6～2.7", "3.14～3.16"], "a": 2, "p": "p.112"}, {"id": "4-71", "sec": "第四章 混凝土工程", "s": "使用輸送泵泵送之混凝土，粗粒料標稱最大粒徑應小於輸送管內徑的？", "o": ["1/2", "1/3", "1/4", "1/5"], "a": 2, "p": "p.113"}, {"id": "4-72", "sec": "第四章 混凝土工程", "s": "粒料自氣乾狀況至面乾內飽和狀態所吸之水量稱為？", "o": ["含水量", "吸水量", "有效吸水量", "表面含水量"], "a": 2, "p": "p.114"}, {"id": "4-73", "sec": "第四章 混凝土工程", "s": "理論配比粗粒料（SSD）1190 kg，工地粗粒料表面含水量 2%，實際應計量多少？", "o": ["1166 kg", "1190 kg", "1214 kg", "1238 kg"], "a": 2, "p": "p.117"}, {"id": "4-74", "sec": "第四章 混凝土工程", "s": "減水劑之作用原理為？", "o": ["產生微小氣泡", "表面活性劑，使水泥顆粒分散，可減少用水量", "延緩水化", "產生膨脹"], "a": 1, "p": "p.119"}, {"id": "4-75", "sec": "第四章 混凝土工程", "s": "卜作嵐材料之特性為？", "o": ["本身具強黏結性", "本身無黏結性，在有水狀態下能與水泥水化作用", "只能用於水中", "會加速凝結"], "a": 1, "p": "p.119"}, {"id": "4-76", "sec": "第四章 混凝土工程", "s": "高爐熟料經水淬急冷，形成粒徑約多少之玻璃質粒子？", "o": ["0.01mm", "1mm", "5mm", "15mm"], "a": 1, "p": "p.120"}, {"id": "4-77", "sec": "第四章 混凝土工程", "s": "使混凝土在硬化前產生膨脹之發泡劑，例如？", "o": ["氯化鈣", "鋁、鎂、鋅等粉末", "木磺酸", "飛灰"], "a": 1, "p": "p.121"}, {"id": "4-78", "sec": "第四章 混凝土工程", "s": "表面硬化劑常用於？", "o": ["停車場地板", "水庫壩體", "地下室外牆", "基樁"], "a": 0, "p": "p.121"}, {"id": "4-79", "sec": "第四章 混凝土工程", "s": "依施工規範2.6，水泥使用時其溫度不得超過？", "o": ["30 ℃", "40 ℃", "50 ℃", "60 ℃"], "a": 2, "p": "p.122"}, {"id": "4-80", "sec": "第四章 混凝土工程", "s": "坍度模之尺寸為？", "o": ["頂徑 10cm、底徑 20cm、高 30cm", "頂徑 15cm、底徑 15cm、高 30cm", "頂徑 20cm、底徑 10cm、高 30cm", "頂徑 10cm、底徑 20cm、高 20cm"], "a": 0, "p": "p.123"}, {"id": "4-81", "sec": "第四章 混凝土工程", "s": "坍流度試驗主要用於判斷何種混凝土之工作度？", "o": ["滾壓混凝土", "自充填混凝土（SCC）", "噴凝土", "透水混凝土"], "a": 1, "p": "p.125"}, {"id": "4-82", "sec": "第四章 混凝土工程", "s": "混凝土空氣含量試驗依據之國家標準為？", "o": ["CNS 1176", "CNS 1177", "CNS 1230", "CNS 13465"], "a": 1, "p": "p.126"}, {"id": "4-83", "sec": "第四章 混凝土工程", "s": "抗壓試體 24 小時後拆模，再置於多少溫度之濕槽中養護？", "o": ["16～27 ℃", "23 ± 1.7 ℃", "30 ± 2 ℃", "5 ± 1 ℃"], "a": 1, "p": "p.128"}, {"id": "習4-8", "sec": "習題四（畫圈題）", "s": "有關水中混凝土施工規範，何者錯誤？", "o": ["模板須緊密不漏漿", "澆置後至少 48 小時內該區不得抽水", "特密管直徑為 20～25cm", "特密管可水平移動以加快澆置"], "a": 3, "p": "p.101"}, {"id": "習4-12", "sec": "習題四（畫圈題）", "s": "下列何者「不是」粒料應具備之特性？", "o": ["潔淨", "堅硬、強度高", "粒形好、級配佳", "吸水率大"], "a": 3, "p": "p.112"}, {"id": "習4-25", "sec": "習題四（畫圈題）", "s": "澆置混凝土之原則，何者錯誤？", "o": ["平衡載重", "材料不析離", "模板不爆裂", "盡量設置接縫以利分段"], "a": 3, "p": "p.147"}, {"id": "習4-32", "sec": "習題四（畫圈題）", "s": "下列何者屬於「施工階段」防止鋼筋混凝土構造物裂縫之方法？", "o": ["增加保護層厚度", "使用預力混凝土", "模板應緊密以免漏漿", "採用礦粉摻料"], "a": 2, "p": "p.162–163"}];
const L = ['A','B','C','D'];
const KEY = 'civil-quiz-wrong-v1';
const $ = id => document.getElementById(id);
let wrongBook = new Set();
try { wrongBook = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e) {}
const saveWrong = () => { try { localStorage.setItem(KEY, JSON.stringify([...wrongBook])); } catch(e) {} };

const sections = [...new Set(RAW.map(q => q.sec))];
const counts = [10, 20, 50, '全部'];
let chosenCount = 20, deck = [], i = 0, right = 0, missed = [], answered = false;

$('total').textContent = RAW.length;
$('secs').innerHTML = sections.map((s, k) =>
  `<label class="opt"><input type="checkbox" value="${k}" checked> ${s}（${RAW.filter(q => q.sec === s).length}）</label>`).join('');
$('counts').innerHTML = counts.map(c => `<button class="chip${c === chosenCount ? ' on' : ''}" data-c="${c}">${c === '全部' ? '全部' : c + ' 題'}</button>`).join('');
$('counts').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  chosenCount = b.dataset.c === '全部' ? '全部' : +b.dataset.c;
  [...$('counts').children].forEach(x => x.classList.toggle('on', x === b));
};
const refreshWrong = () => { $('wrongN').textContent = wrongBook.size; $('wrongBtn').disabled = wrongBook.size === 0; };
refreshWrong();

function shuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function build(qs) {
  return shuffle(qs.slice()).map(q => {
    const order = shuffle([0, 1, 2, 3]);
    return { ...q, opts: order.map(o => q.o[o]), ans: order.indexOf(q.a) };
  });
}
function show(id) { ['setup', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }

function begin(qs) {
  deck = build(qs); i = 0; right = 0; missed = [];
  show('quiz'); render();
}
$('start').onclick = () => {
  const picked = [...$('secs').querySelectorAll('input:checked')].map(x => sections[+x.value]);
  $('warn').hidden = picked.length > 0;
  if (!picked.length) return;
  let pool = RAW.filter(q => picked.includes(q.sec));
  pool = shuffle(pool);
  if (chosenCount !== '全部') pool = pool.slice(0, chosenCount);
  begin(pool);
};
$('wrongBtn').onclick = () => begin(RAW.filter(q => wrongBook.has(q.id)));

function render() {
  const q = deck[i]; answered = false;
  $('pos').textContent = `第 ${i + 1} / ${deck.length} 題`;
  $('score').textContent = `答對 ${right}`;
  $('prog').style.width = (i / deck.length * 100) + '%';
  $('qid').textContent = `${q.sec}・${q.id}`;
  $('stem').textContent = q.s;
  $('choices').innerHTML = q.opts.map((o, k) => `<button class="choice" data-k="${k}"><b>(${L[k]})</b>${o}</button>`).join('');
  $('fb').innerHTML = '';
  $('next').disabled = true;
  $('next').textContent = i === deck.length - 1 ? '看成績' : '下一題';
}
$('choices').onclick = e => {
  const b = e.target.closest('.choice'); if (!b || answered) return;
  answered = true;
  const q = deck[i], k = +b.dataset.k, btns = $('choices').children;
  btns[q.ans].classList.add('ok');
  if (k === q.ans) {
    right++; wrongBook.delete(q.id);
    $('fb').innerHTML = `<div class="fb ok">答對了｜課本 ${q.p}</div>`;
  } else {
    b.classList.add('bad'); wrongBook.add(q.id);
    missed.push({ q, pick: k });
    $('fb').innerHTML = `<div class="fb bad">正確答案是 (${L[q.ans]}) ${q.opts[q.ans]}｜課本 ${q.p}</div>`;
  }
  saveWrong();
  $('score').textContent = `答對 ${right}`;
  $('next').disabled = false;
};
$('next').onclick = () => { if (i < deck.length - 1) { i++; render(); } else finish(); };
$('quit').onclick = () => { deck = deck.slice(0, i + (answered ? 1 : 0)); finish(); };

function finish() {
  const n = deck.length;
  $('pct').textContent = n ? Math.round(right / n * 100) + ' 分' : '—';
  $('detail').textContent = `${n} 題中答對 ${right} 題`;
  $('review').innerHTML = missed.length ? missed.map(({ q, pick }) =>
    `<div class="rev"><div class="qid">${q.id}｜${q.p}</div><div>${q.s}</div>
     <div class="y">你選：(${L[pick]}) ${q.opts[pick]}</div><div class="a">正解：(${L[q.ans]}) ${q.opts[q.ans]}</div></div>`).join('')
    : '<p class="center">全對，太強了！</p>';
  $('retryWrong').disabled = !missed.length;
  show('result'); refreshWrong();
}
$('retryWrong').onclick = () => begin(missed.map(m => RAW.find(r => r.id === m.q.id)));
$('home').onclick = () => { refreshWrong(); show('setup'); };
</script>
