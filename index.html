<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>土木系線上題庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: single centered column, home = two subject cards, quiz = one card per question */
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mute:#6b6f76;--line:#e3dfd6;--acc:#2f5d8a;--acc2:#8a5a2f;--ok:#2e7d4f;--okbg:#e5f4e9;--bad:#b3392f;--badbg:#fbe9e7;--sel:#e7eef6;--warnbg:#fbf3df;--warn:#8a6414}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181b;--card:#202327;--ink:#e8e6e1;--mute:#9aa0a6;--line:#33373c;--acc:#7aa7d6;--acc2:#d6a87a;--ok:#6cc08c;--okbg:#1f3328;--bad:#ec7b70;--badbg:#3a2220;--sel:#1f2b38;--warnbg:#332a17;--warn:#e0bd6f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181b;--card:#202327;--ink:#e8e6e1;--mute:#9aa0a6;--line:#33373c;--acc:#7aa7d6;--acc2:#d6a87a;--ok:#6cc08c;--okbg:#1f3328;--bad:#ec7b70;--badbg:#3a2220;--sel:#1f2b38;--warnbg:#332a17;--warn:#e0bd6f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.warn{color:var(--bad);font-size:.9rem;margin:8px 0 0}
button:focus-visible,.choice:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:1.4rem;margin:8px 0 4px;text-wrap:balance}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.subj{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 18px 20px;margin-bottom:14px;color:var(--ink);cursor:pointer;font:inherit;border-left:5px solid var(--acc)}
.subj.m{border-left-color:var(--acc2)}
.subj .n{font-size:1.2rem;font-weight:700;display:block}
.subj .d{color:var(--mute);font-size:.9rem;display:block;margin-top:2px}
.subj .c{font-size:.85rem;display:block;margin-top:8px;color:var(--ink)}
.back{background:none;border:0;color:var(--acc);font:inherit;font-size:.95rem;padding:4px 0;cursor:pointer;margin-bottom:4px}
label.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
label.opt:last-child{border-bottom:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer}
button.ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:1rem;cursor:pointer;margin-top:10px}
button:disabled{opacity:.45;cursor:default}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums}
.qid{font-size:.8rem;color:var(--mute)}
.stem{font-size:1.08rem;font-weight:600;margin:6px 0 14px}
.choice{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1rem;cursor:pointer}
.choice b{display:inline-block;width:1.6em;color:var(--mute)}
.choice.sel{border-color:var(--acc);background:var(--sel)}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.choice.miss{border-color:var(--ok);border-style:dashed}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.est{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:.85rem}
.big{font-size:2.6rem;font-weight:700;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.center{text-align:center;color:var(--mute)}
.rev{border-left:3px solid var(--bad);padding:6px 0 6px 12px;margin:12px 0}
.rev .a{color:var(--ok);font-size:.93rem}
.rev .y{color:var(--bad);font-size:.93rem}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-right:6px}
textarea{width:100%;min-height:110px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:.97rem}
.ans p{margin:0 0 6px}.ans p:last-child{margin:0}
.ansh{font-weight:600;color:var(--acc);margin-bottom:6px}
.kw{margin-top:10px;font-size:.93rem}
.kw .h{font-weight:600}
.k{display:inline-block;padding:1px 8px;margin:3px 4px 0 0;border-radius:999px;font-size:.85rem}
.k.y{background:var(--okbg);color:var(--ok)}
.k.n{background:var(--badbg);color:var(--bad)}
.self{display:flex;gap:8px;margin-top:12px}.self button{flex:1}
.okbtn{padding:12px;border-radius:12px;border:1.5px solid var(--ok);background:var(--okbg);color:var(--ok);font-size:1rem;font-weight:600;cursor:pointer}
.badbtn{padding:12px;border-radius:12px;border:1.5px solid var(--bad);background:var(--badbg);color:var(--bad);font-size:1rem;font-weight:600;cursor:pointer}
.hint{color:var(--mute);font-size:.85rem;margin:-6px 0 10px}
</style>
<div class="wrap">
  <section id="home">
    <h1>土木系線上題庫</h1>
    <p class="sub">選一個科目開始練習</p>
    <div id="subjects"></div>
    <p class="hint">錯題本記在你自己的手機或瀏覽器，同學之間互不影響。</p>
  </section>

  <section id="setup" hidden>
    <button class="back" id="toHome">‹ 換科目</button>
    <h1 id="sTitle"></h1>
    <p class="sub" id="sSub"></p>
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">出題範圍</div>
      <div id="secs"></div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px">題數</div>
      <div class="row" id="counts"></div>
    </div>
    <button class="main" id="start">開始測驗</button>
    <p class="warn" id="warn" hidden>請至少勾選一個出題範圍</p>
    <button class="ghost" id="wrongBtn">只練錯題本（<span id="wrongN">0</span> 題）</button>
  </section>

  <section id="quiz" hidden>
    <div class="meta"><span id="pos"></span><span id="score"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="qid" id="qid"></div>
      <div class="stem" id="stem"></div>
      <div id="choices"></div>
      <div id="fb"></div>
    </div>
    <button class="main" id="next" disabled>下一題</button>
    <button class="ghost" id="quit">結束並看成績</button>
  </section>

  <section id="result" hidden>
    <div class="card">
      <div class="center">本次得分</div>
      <div class="big" id="pct"></div>
      <div class="center" id="detail"></div>
    </div>
    <div class="card"><div style="font-weight:600">錯題檢討</div><div id="review"></div></div>
    <button class="main" id="retryWrong">重做這次錯的題目</button>
    <button class="ghost" id="backSetup">回出題設定</button>
  </section>
</div>

<script>

區不得抽水。③ 特密管直徑 20～25cm，漏斗頂端加設 50mm×50mm 網目鋼網防堵塞。④ 澆置時特密管下端應伸入已澆置混凝土表面下至少 2m。⑤ 特密管不得水平移動，上下移動落差不超過 30cm。⑥ 水之流速控制在 3 m/min 以下。", "p": "課本 p.101–102", "kw": ["船塢", "碼頭", "基樁", "橋墩", "不漏漿", "48", "抽水", "特密管"]}, {"t": "sa", "id": "習4-12", "sec": "簡答題（習題畫圈）", "s": "粒料應具備之特性為何？試說明之。", "ans": "① 潔淨：有害物質應在容許範圍內，以免影響混凝土品質。//② 堅硬：須具適當硬度，以抵抗磨損及衝擊。//③ 強度高：須具足夠之抗壓強度。//④ 耐久性強：須能抵抗物理及化學作用。//⑤ 粒形好、級配佳：粒形好則工作度佳，級配佳則強度高。", "p": "課本 p.112", "kw": ["潔淨", "堅硬", "強度", "耐久", "粒形", "級配"]}, {"t": "sa", "id": "習4-25", "sec": "簡答題（習題畫圈）", "s": "澆置混凝土之原則如何？", "ans": "① 平衡載重：平均分散位置澆置，減少模板集中載重，防止模板倒塌。//② 材料不析離：避免混凝土由高處自由落體或沿斜坡自由流動。//③ 模板不爆裂：以適當速度澆置，避免衝擊模板過大。//④ 澆置無接縫：連續澆置混凝土，避免發生冷縫。", "p": "課本 p.147", "kw": ["平衡載重", "不析離", "不爆裂", "無接縫", "冷縫"]}, {"t": "sa", "id": "習4-32", "sec": "簡答題（習題畫圈）", "s": "列舉三項施工階段防止鋼筋混凝土構造物產生裂縫之方法。", "ans": "（任舉三項）//① 避免密集的配筋，以免工作度差而造成蜂窩龜裂。//② 鋼筋確實固定，以免移動影響保護層厚度。//③ 模板應緊密，以免漏漿而造成蜂窩龜裂。//④ 規劃施工縫適當位置。//⑤ 預力混凝土鋼腱套管內應依規定灌漿。//⑥ 確實搗實。//⑦ 良好混凝土養護。//⑧ 加強品管以符設計要求。", "p": "課本 p.162–163", "kw": ["配筋", "鋼筋確實固定", "模板", "施工縫", "灌漿", "搗實", "養護", "品管"]}]}, "mat": {"name": "工程材料", "sub": "總複習：01 材料工程概念・02 材料性質（陳松靖博士）", "qs": [{"t": "mc", "id": "1-1", "sec": "單選題", "s": "根據美國土木工程師學會（ASCE）的道德準則，哪一個概念在1997年被修訂納入，成為土木工程師必須關注的道德議題？", "o": ["經濟效益", "結構安全", "永續發展", "美學設計"], "a": [2], "p": "講義 1 材料工程概念", "est": false}, {"t": "mc", "id": "1-2", "sec": "單選題", "s": "在大地工程師眼中，哪一種被視為使用最廣泛的工程材料，為所有土木工程結構提供基本支撐？", "o": ["混凝土", "鋼筋", "木材", "土壤"], "a": [3], "p": "講義 1 材料工程概念", "est": false}, {"t": "mc", "id": "1-3", "sec": "單選題", "s": "下列何者是混凝土行業的技術突破，使得生產更強韌的混凝土成為可能？", "o": ["輕質合成粒料", "高效減水劑", "彈性材料接頭", "聚合物"], "a": [1], "p": "講義 1 材料工程概念", "est": false}, {"t": "mc", "id": "1-4", "sec": "單選題", "s": "纖維複合材料（如纖維增強聚合物）相較於傳統材料，其主要優勢是什麼？", "o": ["成本較低", "生產速度較快", "更高的強度重量比", "較容易在當地取得"], "a": [2], "p": "講義 1 材料工程概念", "est": false}, {"t": "mc", "id": "1-5", "sec": "單選題", "s": "為何土木工程材料的性質與特性通常具有高度變異性？", "o": ["因為材料皆為進口，來源不一", "因為經常使用當地可用的、精煉程度較低的材料", "因為分子結構比其他工程領域的材料更複雜", "因為缺乏品質管制的標準"], "a": [1], "p": "講義 1 材料 }
$('toHome').onclick = () => { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} show('home'); };
$('counts').innerHTML = counts.map(c => `<button class="chip${c === chosenCount ? ' on' : ''}" data-c="${c}">${c === '全部' ? '全部' : c + ' 題'}</button>`).join('');
$('counts').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  chosenCount = b.dataset.c === '全部' ? '全部' : +b.dataset.c;
  [...$('counts').children].forEach(x => x.classList.toggle('on', x === b));
};
function refreshWrong() { const n = qs().filter(q => book().has(q.id)).length; $('wrongN').textContent = n; $('wrongBtn').disabled = n === 0; }

function shuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function build(list) {
  return shuffle(list.slice()).map(q => {
    if (q.t === 'sa') return { ...q };
    const order = shuffle(q.o.map((_, k) => k));
    return { ...q, opts: order.map(o => q.o[o]), ans: q.a.map(a => order.indexOf(a)).sort((x, y) => x - y) };
  });
}
function begin(list) { deck = build(list); i = 0; right = 0; missed = []; show('quiz'); render(); }
$('start').onclick = () => {
  const picked = [...$('secs').querySelectorAll('input:checked')].map(x => x.value);
  $('warn').hidden = picked.length > 0;
  if (!picked.length) return;
  let pool = shuffle(qs().filter(q => picked.includes(q.sec)));
  if (chosenCount !== '全部') pool = pool.slice(0, chosenCount);
  begin(pool);
};
$('wrongBtn').onclick = () => begin(qs().filter(q => book().has(q.id)));

const letters = arr => arr.map(k => L[k]).join('');
const estNote = q => q.est ? '<div class="est">※ 講義未附此題答案，此為依課文推定，請再跟老師或同學確認。</div>' : '';

function render() {
  const q = deck[i]; answered = false; picks = new Set();
  $('pos').textContent = `第 ${i + 1} / ${deck.length} 題`;
  $('score').textContent = `答對 ${right}`;
  $('prog').style.width = (i / deck.length * 100) + '%';
  $('qid').innerHTML = `<span class="tag">${TYPE[q.t]}</span>${esc(q.sec)}・${esc(q.id)}`;
  $('stem').textContent = q.s;
  $('fb').innerHTML = '';
  $('next').disabled = true;
  $('next').textContent = i === deck.length - 1 ? '看成績' : '下一題';
  if (q.t === 'sa') {
    $('choices').innerHTML = `<textarea id="draft" placeholder="先自己寫寫看，寫了會比對關鍵字（可不填）"></textarea>
      <button class="main" id="reveal" style="margin-top:10px">看參考答案</button><div id="saOut"></div>`;
    return;
  }
  $('choices').innerHTML = (q.t === 'mm' ? '<p class="hint">多選題：選出所有正確選項，再按送出</p>' : '') +
    q.opts.map((o, k) => `<button class="choice" data-k="${k}"><b>(${L[k]})</b>${esc(o)}</button>`).join('') +
    (q.t === 'mm' ? '<button class="main" id="submit" style="margin-top:6px" disabled>送出答案</button>' : '');
}
const ansHtml = q => `<div class="ans"><div class="ansh">參考答案｜${esc(q.p)}</div>${q.ans.split('//').map(x => `<p>${esc(x)}</p>`).join('')}</div>`;
const norm = s => s.replace(/[\s　,，、。．.]/g, '').toLowerCase();
function kwHtml(q, draft) {
  if (!q.kw || !q.kw.length) return '';
  if (!norm(draft)) return `<div class="kw"><span class="h">關鍵字</span>（沒寫答案，所以沒比對）<br>${q.kw.map(k => `<span class="k n">${esc(k)}</span>`).join('')}</div>`;
  const d = norm(draft), hit = q.kw.filter(k => d.includes(norm(k)));
  const pct = Math.round(hit.length / q.kw.length * 100);
  return `<div class="kw"><span class="h">關鍵字 ${hit.length} / ${q.kw.length}（約 ${pct}%）</span><br>${q.kw.map(k => `<span class="k ${hit.includes(k) ? 'y' : 'n'}">${hit.includes(k) ? '✓' : '✗'} ${esc(k)}</span>`).join('')}</div>`;
}
function mark(ok, q, pickText) {
  answered = true;
  if (ok) { right++; book().delete(q.id); } else { book().add(q.id); missed.push({ q, pickText }); }
  saveBook();
  $('score').textContent = `答對 ${right}`;
  $('next').disabled = false;
}
function selfMark(ok) {
  if (answered) return;
  mark(ok, deck[i], '');
  $('fb').innerHTML = ok ? '<div class="fb ok">已標記為會了</div>' : '<div class="fb bad">已加入錯題本</div>';
  document.querySelectorAll('.self button').forEach(x => x.disabled = true);
}
function grade() {
  const q = deck[i], btns = [...$('choices').querySelectorAll('.choice')];
  const pick = [...picks].sort((x, y) => x - y), ok = pick.join() === q.ans.join();
  btns.forEach((b, k) => {
    b.disabled = true;
    const inAns = q.ans.includes(k), picked = picks.has(k);
    b.classList.remove('sel');
    if (inAns && picked) b.classList.add('ok');
    else if (picked) b.classList.add('bad');
    else if (inAns) b.classList.add(q.t === 'mm' ? 'miss' : 'ok');
  });
  if ($('submit')) $('submit').remove();
  const right_ = q.ans.map(k => `(${L[k]}) ${esc(q.opts[k])}`).join('、');
  $('fb').innerHTML = (ok ? `<div class="fb ok">答對了｜${esc(q.p)}</div>`
    : `<div class="fb bad">正確答案：${q.t === 'mm' ? letters(q.ans) + '｜' : ''}${right_}｜${esc(q.p)}</div>`) + estNote(q);
  mark(ok, q, pick.map(k => `(${L[k]}) ${q.opts[k]}`).join('、'));
}
$('choices').onclick = e => {
  const t = e.target;
  if (t.id === 'reveal') {
    const q = deck[i], draft = $('draft').value;
    $('saOut').innerHTML = kwHtml(q, draft) + ansHtml(q) + '<div class="self"><button class="okbtn" id="saOk">我會了</button><button class="badbtn" id="saNo">還不熟</button></div>';
    t.remove(); return;
  }
  if (t.id === 'saOk') return selfMark(true);
  if (t.id === 'saNo') return selfMark(false);
  if (t.id === 'submit') { if (!answered && picks.size) grade(); return; }
  const b = t.closest('.choice'); if (!b || answered) return;
  const k = +b.dataset.k, q = deck[i];
  if (q.t === 'mm') {
    picks.has(k) ? picks.delete(k) : picks.add(k);
    b.classList.toggle('sel', picks.has(k));
    $('submit').disabled = picks.size === 0;
  } else { picks = new Set([k]); grade(); }
};
$('next').onclick = () => { if (i < deck.length - 1) { i++; render(); } else finish(); };
$('quit').onclick = () => { deck = deck.slice(0, i + (answered ? 1 : 0)); finish(); };

function finish() {
  const n = deck.length;
  $('pct').textContent = n ? Math.round(right / n * 100) + ' 分' : '—';
  $('detail').textContent = `${n} 題中答對 ${right} 題`;
  $('review').innerHTML = missed.length ? missed.map(({ q, pickText }) => q.t === 'sa'
    ? `<div class="rev"><div class="qid">${esc(q.id)}｜簡答</div><div>${esc(q.s)}</div>${ansHtml(q)}</div>`
    : `<div class="rev"><div class="qid">${esc(q.id)}｜${TYPE[q.t]}｜${esc(q.p)}</div><div>${esc(q.s)}</div>
       <div class="y">你選：${esc(pickText)}</div><div class="a">正解：${q.ans.map(k => `(${L[k]}) ${esc(q.opts[k])}`).join('、')}</div></div>`).join('')
    : '<p class="center">全對，太強了！</p>';
  $('retryWrong').disabled = !missed.length;
  show('result');
}
$('retryWrong').onclick = () => begin(missed.map(m => qs().find(r => r.id === m.q.id)));
$('backSetup').onclick = () => { refreshWrong(); show('setup'); };

const h = location.hash.slice(1);
if (DATA[h]) openSubj(h); else show('home');
</script>

</body>
</html>
